<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 | anymouse.site</title>

    <link rel="icon" type="image/png" href="assets/img/mouseicon.png">

    <meta name="theme-color" content="#0a0a0a">
    <meta name="description" content="Page not found.">

    <link rel="stylesheet" href="assets/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            padding: 24px;
        }
        .err-num {
            font-size: 4rem;
            font-weight: 700;
            color: #333;
            letter-spacing: -0.02em;
            line-height: 1;
            margin-bottom: 12px;
        }
        .err-msg {
            font-size: 0.9rem;
            color: #a0a0a0;
            margin-bottom: 32px;
        }
        .err-link {
            font-size: 0.85rem;
            color: #a0a0a0;
            text-decoration: none;
            border: 1px solid rgba(255,255,255,0.06);
            padding: 10px 24px;
            border-radius: 10px;
            transition: color 200ms, border-color 200ms;
        }
        .err-link:hover {
            color: #f5f5f5;
            border-color: rgba(255,255,255,0.12);
        }
    </style>
</head>

<body>
    <div class="err-num">404</div>
    <p class="err-msg">this page doesn't exist.</p>
    <a href="/" class="err-link">go back</a>

    <script>
        const path = window.location.pathname.toLowerCase()
        if (path === '/voxelith' || path === '/voxelith/') {
            window.location.replace('/Voxelith/')
        }
    </script>
</body>

</html>
