<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>shadowsmith - layered css shadow generator</title>
<meta name="description" content="build smooth layered box-shadows and copy the css. free tool by anymousxe.">
<meta property="og:title" content="shadowsmith - layered css shadow generator">
<meta property="og:description" content="build smooth layered box-shadows, copy the css. free dev tool.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0b0d;--panel:#121214;--panel2:#16161a;--border:rgba(255,255,255,.09);
  --border-h:rgba(255,255,255,.24);--text:#f2f2f3;--muted:#9a9aa2;--dim:#646470;
  --fm:'Geist Mono',ui-monospace,monospace;--fd:'Geist',system-ui,sans-serif;--ease:cubic-bezier(.22,1,.36,1);
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:var(--fd);-webkit-font-smoothing:antialiased;overflow:hidden}
::selection{background:rgba(255,255,255,.16)}
.app{display:grid;grid-template-columns:1fr 380px;height:100vh}
/* stage */
.stage{position:relative;display:grid;place-items:center;overflow:hidden;background:
  radial-gradient(120% 120% at 50% 0%, #15151a, #0b0b0d 70%);}
.stage-top{position:absolute;top:0;left:0;right:0;z-index:5;display:flex;align-items:center;justify-content:space-between;padding:20px 24px}
.brand{display:flex;align-items:center;gap:9px;font-weight:600;letter-spacing:-.02em;font-size:1.05rem}
.brand .m{width:18px;height:18px;border-radius:5px;background:#1c1c22;box-shadow:0 4px 14px rgba(0,0,0,.6),0 1px 2px rgba(0,0,0,.4);border:1px solid var(--border)}
.by{font-family:var(--fm);font-size:.74rem;color:var(--muted);text-decoration:none}.by:hover{color:#fff}
.preview-box{width:200px;height:200px;border-radius:24px;background:var(--prevbg,#e9e9ec);transition:box-shadow .12s linear,background .2s}
.bg-toggle{position:absolute;bottom:20px;left:24px;z-index:5;display:flex;gap:6px}
.bg-toggle button{width:28px;height:28px;border-radius:7px;border:1px solid var(--border);cursor:pointer;transition:transform .15s,border-color .2s}
.bg-toggle button:hover{transform:scale(1.08);border-color:var(--border-h)}
/* panel */
.panel{background:var(--panel);border-left:1px solid var(--border);display:flex;flex-direction:column;overflow-y:auto}
.panel::-webkit-scrollbar{width:7px}.panel::-webkit-scrollbar-thumb{background:#222;border-radius:4px}
.phead{padding:22px 22px 16px;border-bottom:1px solid var(--border)}
.phead h1{font-size:1.15rem;font-weight:600;letter-spacing:-.02em}
.phead p{font-size:.82rem;color:var(--muted);margin-top:4px}
.layers{padding:16px 22px;border-bottom:1px solid var(--border)}
.slabel{font-family:var(--fm);font-size:.68rem;text-transform:uppercase;letter-spacing:.14em;color:var(--dim);margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
.layer{background:var(--panel2);border:1px solid var(--border);border-radius:10px;padding:12px;margin-bottom:8px;transition:border-color .2s}
.layer.active{border-color:var(--border-h)}
.layer-head{display:flex;align-items:center;justify-content:between;gap:8px;cursor:pointer}
.layer-head .ltitle{flex:1;font-family:var(--fm);font-size:.78rem;color:var(--text)}
.layer-head .swatch{width:18px;height:18px;border-radius:5px;border:1px solid var(--border)}
.layer-head .del{border:none;background:none;color:var(--dim);cursor:pointer;font-size:1rem;padding:2px 6px;border-radius:5px;transition:color .2s,background .2s}
.layer-head .del:hover{color:#ff6b6b;background:rgba(255,107,107,.1)}
.layer-ctrls{margin-top:12px;display:none}
.layer.open .layer-ctrls{display:block}
.ctrl{margin-bottom:11px}
.ctrl:last-child{margin-bottom:0}
.crow{display:flex;justify-content:space-between;margin-bottom:6px}
.crow label{font-size:.78rem;color:var(--muted)}.crow .v{font-family:var(--fm);font-size:.74rem;color:var(--text)}
input[type=range]{width:100%;-webkit-appearance:none;height:4px;border-radius:2px;background:#2a2a30;outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:15px;border-radius:50%;background:#fff;cursor:pointer;transition:transform .15s}
input[type=range]::-webkit-slider-thumb:hover{transform:scale(1.18)}
.colorrow{display:flex;align-items:center;gap:9px}
.colorrow input[type=color]{width:32px;height:32px;border:none;border-radius:7px;background:none;cursor:pointer;padding:0}
.colorrow input[type=color]::-webkit-color-swatch{border:1px solid var(--border);border-radius:7px}
.colorrow .hex{flex:1;font-family:var(--fm);font-size:.8rem;color:var(--text);background:none;border:none;outline:none;text-transform:uppercase}
.add{width:100%;padding:10px;background:var(--panel2);border:1px dashed var(--border);border-radius:10px;color:var(--muted);font-family:var(--fm);font-size:.78rem;cursor:pointer;transition:all .2s}
.add:hover{border-color:var(--border-h);color:var(--text)}
.presets{padding:16px 22px;border-bottom:1px solid var(--border);display:flex;gap:8px;flex-wrap:wrap}
.preset{padding:7px 13px;background:var(--panel2);border:1px solid var(--border);border-radius:8px;font-family:var(--fm);font-size:.74rem;color:var(--muted);cursor:pointer;transition:all .2s}
.preset:hover{border-color:var(--border-h);color:var(--text)}
.btns{padding:18px 22px;display:flex;flex-direction:column;gap:9px;margin-top:auto}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;padding:12px;border-radius:11px;font-family:var(--fd);font-size:.9rem;font-weight:500;cursor:pointer;border:1px solid var(--border);background:var(--panel2);color:var(--text);transition:all .2s}
.btn:hover{border-color:var(--border-h);transform:translateY(-1px)}
.btn.primary{background:#fff;color:#0b0b0d;border-color:#fff}
.btn.copied{background:#4ade80;color:#0b0b0d;border-color:#4ade80}
.code{padding:14px 22px;background:#0d0d0f;border-top:1px solid var(--border)}
.code pre{font-family:var(--fm);font-size:.7rem;color:var(--muted);white-space:pre-wrap;word-break:break-all;line-height:1.55;max-height:120px;overflow-y:auto}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:#fff;color:#0b0b0d;padding:10px 18px;border-radius:10px;font-size:.85rem;font-weight:500;opacity:0;transition:all .3s var(--ease);pointer-events:none;z-index:50}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(max-width:820px){.app{grid-template-columns:1fr;grid-template-rows:38vh 1fr}.panel{border-left:none;border-top:1px solid var(--border)}}
</style>
</head>
<body>
<div class="app">
  <div class="stage" id="stage">
    <div class="stage-top">
      <div class="brand"><span class="m"></span> shadowsmith</div>
      <a href="https://anymousxe.dev" target="_blank" rel="noopener" class="by">by anymousxe -&gt;</a>
    </div>
    <div class="preview-box" id="box"></div>
    <div class="bg-toggle">
      <button style="background:#e9e9ec" data-bg="#e9e9ec"></button>
      <button style="background:#0b0b0d" data-bg="#0b0b0d"></button>
      <button style="background:#6c5ce7" data-bg="#6c5ce7"></button>
    </div>
  </div>

  <div class="panel">
    <div class="phead">
      <h1>layered shadow generator</h1>
      <p>stack soft shadows for that real depth. copy the css.</p>
    </div>

    <div class="presets" id="presets"></div>

    <div class="layers">
      <div class="slabel">layers <span id="count"></span></div>
      <div id="layerList"></div>
      <button class="add" id="add">+ add layer</button>
    </div>

    <div class="btns">
      <button class="btn primary" id="copy">copy css</button>
    </div>
    <div class="code"><pre id="out"></pre></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const $=s=>document.querySelector(s);
let layers=[], openIdx=0;
const PRESETS={
  'soft':[{x:0,y:2,blur:4,spread:-1,color:'#000000',a:18},{x:0,y:8,blur:16,spread:-4,color:'#000000',a:14}],
  'sharp':[{x:0,y:1,blur:0,spread:0,color:'#000000',a:30}],
  'layered':[{x:0,y:1,blur:2,spread:0,color:'#000000',a:12},{x:0,y:4,blur:8,spread:-2,color:'#000000',a:12},{x:0,y:12,blur:24,spread:-6,color:'#000000',a:14}],
  'glow':[{x:0,y:0,blur:24,spread:2,color:'#6c5ce7',a:55}],
  'long':[{x:0,y:18,blur:40,spread:-12,color:'#000000',a:35}],
};
function newLayer(){return{x:0,y:8,blur:20,spread:-4,color:'#000000',a:25};}
function hexA(hex,a){const h=hex.replace('#','');const r=parseInt(h.slice(0,2),16),g=parseInt(h.slice(2,4),16),b=parseInt(h.slice(4,6),16);return `rgba(${r}, ${g}, ${b}, ${(a/100).toFixed(2)})`;}
function css(){return layers.map(l=>`${l.x}px ${l.y}px ${l.blur}px ${l.spread}px ${hexA(l.color,l.a)}`).join(',\n            ');}
function render(){
  $('#box').style.boxShadow=css();
  $('#count').textContent=layers.length;
  $('#out').textContent='box-shadow:\n  '+css()+';';
  renderLayers();
}
function renderLayers(){
  const c=$('#layerList');c.innerHTML='';
  layers.forEach((l,i)=>{
    const el=document.createElement('div');
    el.className='layer'+(i===openIdx?' open active':'');
    el.innerHTML=`
      <div class="layer-head" data-i="${i}">
        <span class="swatch" style="background:${hexA(l.color,l.a)}"></span>
        <span class="ltitle">layer ${i+1}</span>
        <button class="del" data-del="${i}" title="remove">x</button>
      </div>
      <div class="layer-ctrls">
        ${rangeCtrl('x','x offset',l.x,-50,50)}
        ${rangeCtrl('y','y offset',l.y,-50,50)}
        ${rangeCtrl('blur','blur',l.blur,0,80)}
        ${rangeCtrl('spread','spread',l.spread,-30,30)}
        ${rangeCtrl('a','opacity',l.a,0,100)}
        <div class="ctrl"><div class="crow"><label>color</label></div>
          <div class="colorrow"><input type="color" value="${l.color}" data-c="${i}"><input type="text" class="hex" value="${l.color}" data-h="${i}" maxlength="7"></div></div>
      </div>`;
    c.appendChild(el);
  });
  // events
  c.querySelectorAll('.layer-head').forEach(h=>h.onclick=e=>{if(e.target.dataset.del!==undefined)return;openIdx=+h.dataset.i===openIdx?-1:+h.dataset.i;renderLayers();});
  c.querySelectorAll('[data-del]').forEach(b=>b.onclick=e=>{e.stopPropagation();if(layers.length>1){layers.splice(+b.dataset.del,1);openIdx=Math.min(openIdx,layers.length-1);render();}});
  c.querySelectorAll('input[type=range]').forEach(r=>r.oninput=e=>{layers[openIdx][e.target.dataset.k]=+e.target.value;e.target.closest('.ctrl').querySelector('.v').textContent=e.target.value+(['x','y','blur','spread'].includes(e.target.dataset.k)?'px':'');$('#box').style.boxShadow=css();$('#out').textContent='box-shadow:\n  '+css()+';';c.querySelectorAll('.swatch')[openIdx].style.background=hexA(layers[openIdx].color,layers[openIdx].a);});
  c.querySelectorAll('input[type=color]').forEach(p=>p.oninput=e=>{layers[+e.target.dataset.c].color=e.target.value;render();});
  c.querySelectorAll('.hex').forEach(p=>p.onchange=e=>{let v=e.target.value;if(!/^#/.test(v))v='#'+v;if(/^#[0-9a-f]{6}$/i.test(v)){layers[+e.target.dataset.h].color=v;render();}});
}
function rangeCtrl(k,lbl,val,min,max){const unit=['x','y','blur','spread'].includes(k)?'px':'';return `<div class="ctrl"><div class="crow"><label>${lbl}</label><span class="v">${val}${unit}</span></div><input type="range" data-k="${k}" min="${min}" max="${max}" value="${val}"></div>`;}
// presets
Object.keys(PRESETS).forEach(name=>{const b=document.createElement('button');b.className='preset';b.textContent=name;b.onclick=()=>{layers=PRESETS[name].map(l=>({...l}));openIdx=0;render();};$('#presets').appendChild(b);});
$('#add').onclick=()=>{layers.push(newLayer());openIdx=layers.length-1;render();};
$('#copy').onclick=async()=>{await navigator.clipboard.writeText($('#out').textContent);const b=$('#copy');b.textContent='copied';b.classList.add('copied');toast('css copied');setTimeout(()=>{b.textContent='copy css';b.classList.remove('copied');},1300);};
document.querySelectorAll('.bg-toggle button').forEach(b=>b.onclick=()=>{const bg=b.dataset.bg;document.documentElement.style.setProperty('--prevbg',bg);});
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1500);}
layers=PRESETS['layered'].map(l=>({...l}));
render();
</script>
</body>
</html>
