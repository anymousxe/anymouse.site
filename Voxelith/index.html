<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voxelith</title>

    <link rel="icon" type="image/png" href="../assets/img/mouseicon.png">

    <meta name="theme-color" content="#0a0a0a">
    <meta name="description" content="Voxel engine project by anymousxe. Coming soon.">

    <meta property="og:type" content="website">
    <meta property="og:url" content="https://anymousxe.dev/Voxelith/">
    <meta property="og:title" content="Voxelith">
    <meta property="og:site_name" content="anymousxe.dev">
    <meta property="og:description" content="Voxel engine project by anymousxe. Coming soon.">
    <meta property="og:image" content="https://anymousxe.dev/assets/img/anyrat.png">

    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="https://anymousxe.dev/Voxelith/">
    <meta property="twitter:title" content="Voxelith">
    <meta property="twitter:description" content="Voxel engine project by anymousxe. Coming soon.">
    <meta property="twitter:image" content="https://anymousxe.dev/assets/img/anyrat.png">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --bg: #0a0a0a;
            --bg-card: #141414;
            --border: rgba(255, 255, 255, 0.08);
            --border-hover: rgba(255, 255, 255, 0.18);
            --text: #f0f0f0;
            --text-muted: #999;
            --text-dim: #555;
            --font: 'Inter', system-ui, -apple-system, sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: var(--font);
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
            height: 100vh;
            overflow: hidden;
        }

        ::selection { background: rgba(255, 255, 255, 0.12); color: #fff; }

        /* loader */
        #loader {
            position: fixed;
            inset: 0;
            background: var(--bg);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 800ms ease;
        }

        .loader-inner {
            width: 280px;
        }

        .loader-label {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 0.72rem;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 0.06em;
        }

        .loader-track {
            width: 100%;
            height: 2px;
            background: #1a1a1a;
            border-radius: 1px;
            overflow: hidden;
        }

        .loader-bar {
            height: 100%;
            background: var(--text-muted);
            width: 0%;
            border-radius: 1px;
            animation: loaderFill 2.4s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }

        @keyframes loaderFill {
            0% { width: 0%; }
            35% { width: 55%; }
            70% { width: 80%; }
            100% { width: 100%; }
        }

        /* nav */
        .top-nav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
            height: 52px;
            background: rgba(10, 10, 10, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            padding: 0 24px;
        }

        .nav-back {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.82rem;
            color: var(--text-muted);
            text-decoration: none;
            transition: color 200ms;
        }

        .nav-back:hover { color: var(--text); }

        .nav-back svg {
            width: 15px;
            height: 15px;
            stroke-width: 1.5;
        }

        /* main */
        #main {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            opacity: 0;
            transition: opacity 800ms ease;
            padding: 0 24px;
        }

        #main.visible { opacity: 1; }

        .tag {
            display: inline-block;
            font-size: 0.68rem;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 0.08em;
            border: 1px solid var(--border);
            padding: 4px 12px;
            border-radius: 6px;
            margin-bottom: 24px;
            opacity: 0;
            transform: translateY(8px);
            transition: opacity 400ms ease 100ms, transform 400ms ease 100ms;
        }

        #main.visible .tag {
            opacity: 1;
            transform: translateY(0);
        }

        h1 {
            font-size: clamp(3rem, 10vw, 5rem);
            font-weight: 800;
            letter-spacing: -0.04em;
            line-height: 1;
            margin-bottom: 16px;
            opacity: 0;
            transform: translateY(12px);
            transition: opacity 500ms ease 200ms, transform 500ms ease 200ms;
        }

        #main.visible h1 {
            opacity: 1;
            transform: translateY(0);
        }

        .desc {
            font-size: 0.95rem;
            color: var(--text-muted);
            max-width: 420px;
            line-height: 1.6;
            opacity: 0;
            transform: translateY(8px);
            transition: opacity 400ms ease 350ms, transform 400ms ease 350ms;
        }

        #main.visible .desc {
            opacity: 1;
            transform: translateY(0);
        }

        .credit {
            position: fixed;
            bottom: 28px;
            font-size: 0.72rem;
            color: var(--text-dim);
        }

        /* dots bg */
        #main {
            background-image: radial-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 24px 24px;
        }

        @media (max-width: 600px) {
            .loader-inner { width: 70%; }
        }

        @media (prefers-reduced-motion: reduce) {
            .tag, h1, .desc {
                opacity: 1;
                transform: none;
                transition: none;
            }
            #main { opacity: 1; transition: none; }
        }
    </style>
</head>

<body>

    <div id="loader">
        <div class="loader-inner">
            <div class="loader-label">
                <span>loading</span>
                <span id="pct">0%</span>
            </div>
            <div class="loader-track">
                <div class="loader-bar"></div>
            </div>
        </div>
    </div>

    <nav class="top-nav">
        <a href="https://anymousxe.dev" class="nav-back">
            <i data-lucide="arrow-left"></i>
            anymousxe.dev
        </a>
    </nav>

    <div id="main">
        <div class="tag">side project</div>
        <h1>Voxelith</h1>
        <p class="desc">a voxel engine i'm building. block by block. still in the works but coming together.</p>
        <div class="credit">anymousxe</div>
    </div>

    <script>
        lucide.createIcons()

        let p = 0
        const pct = document.getElementById('pct')
        const timer = setInterval(() => {
            p += Math.floor(Math.random() * 6)
            if (p > 100) p = 100
            pct.textContent = p + '%'
            if (p === 100) clearInterval(timer)
        }, 80)

        setTimeout(() => {
            const loader = document.getElementById('loader')
            const main = document.getElementById('main')
            loader.style.opacity = '0'
            setTimeout(() => {
                loader.style.display = 'none'
                main.classList.add('visible')
            }, 800)
        }, 2800)
    </script>

</body>

</html>
